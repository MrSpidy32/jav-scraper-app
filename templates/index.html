<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAV Ultimate Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- Header & Search Bar -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-6">
                JAV Ultimate Scraper
            </h1>
            <form id="searchForm" class="max-w-xl mx-auto relative">
                <input 
                    type="text" 
                    id="dvdId" 
                    placeholder="Enter JAV Code (e.g. SSIS-001)" 
                    class="w-full bg-gray-800 text-white border border-gray-700 rounded-full py-4 px-6 pr-32 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg shadow-lg"
                    required
                >
                <button 
                    type="submit" 
                    class="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-full px-6 transition-colors duration-200"
                >
                    Search
                </button>
            </form>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden flex flex-col items-center justify-center my-12">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-16 w-16 mb-4"></div>
            <p class="text-gray-400 text-lg animate-pulse">Scraping multiple databases...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden max-w-2xl mx-auto bg-red-900/50 border border-red-500 text-red-200 px-6 py-4 rounded-xl text-center">
        </div>

        <!-- Results Container -->
        <div id="result" class="hidden">
            <!-- Title & ID -->
            <div class="mb-8 border-b border-gray-800 pb-6">
                <div class="flex items-center gap-4 mb-2">
                    <span id="res-id" class="px-4 py-1 bg-blue-600 rounded-lg text-xl font-bold font-mono shadow"></span>
                    <span id="res-studio" class="px-3 py-1 bg-gray-700 rounded-lg text-sm text-gray-300"></span>
                </div>
                <h2 id="res-title" class="text-2xl md:text-3xl font-bold text-gray-100 leading-tight"></h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Left: Poster -->
                <div class="md:col-span-1">
                    <img id="res-poster" src="" alt="Poster" class="w-full rounded-xl shadow-2xl border border-gray-800 object-cover">
                    <div id="res-trailer-container" class="mt-4 hidden">
                        <a id="res-trailer" href="#" target="_blank" class="block w-full text-center bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition-colors">
                            🎬 Watch Trailer
                        </a>
                    </div>
                </div>

                <!-- Right: Metadata -->
                <div class="md:col-span-2 space-y-6">
                    <div class="grid grid-cols-2 gap-4 bg-gray-800/50 p-6 rounded-xl border border-gray-800">
                        <div>
                            <p class="text-gray-500 text-sm uppercase tracking-wider">Release Date</p>
                            <p id="res-date" class="text-lg font-medium"></p>
                        </div>
                        <div>
                            <p class="text-gray-500 text-sm uppercase tracking-wider">Runtime</p>
                            <p id="res-runtime" class="text-lg font-medium"></p>
                        </div>
                        <div>
                            <p class="text-gray-500 text-sm uppercase tracking-wider">Director</p>
                            <p id="res-director" class="text-lg font-medium"></p>
                        </div>
                        <div>
                            <p class="text-gray-500 text-sm uppercase tracking-wider">Series</p>
                            <p id="res-series" class="text-lg font-medium"></p>
                        </div>
                    </div>

                    <!-- Performers -->
                    <div>
                        <h3 class="text-xl font-bold mb-3 border-b border-gray-800 pb-2">Performers</h3>
                        <div id="res-performers" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Genres -->
                    <div>
                        <h3 class="text-xl font-bold mb-3 border-b border-gray-800 pb-2">Genres</h3>
                        <div id="res-genres" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <!-- Screenshots -->
            <div id="screenshots-section" class="mt-12 hidden">
                <h3 class="text-2xl font-bold mb-6 border-b border-gray-800 pb-2">Screenshots</h3>
                <div id="res-screenshots" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dvdId = document.getElementById('dvdId').value.trim();
            if (!dvdId) return;

            // UI State updates
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');

            try {
                const response = await fetch(`/api/scrape?dvd_id=${encodeURIComponent(dvdId)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to scrape movie');
                }

                // Populate UI
                document.getElementById('res-id').textContent = data.dvd_id;
                document.getElementById('res-title').textContent = data.title || 'Unknown Title';
                document.getElementById('res-studio').textContent = data.studio || data.maker || 'Unknown Studio';
                document.getElementById('res-date').textContent = data.release_date || 'N/A';
                document.getElementById('res-runtime').textContent = data.runtime || 'N/A';
                document.getElementById('res-director').textContent = data.director || 'N/A';
                document.getElementById('res-series').textContent = data.series || 'N/A';
                
                // Poster
                const posterEl = document.getElementById('res-poster');
                if (data.cover_url) {
                    posterEl.src = data.cover_url;
                    posterEl.classList.remove('hidden');
                } else {
                    posterEl.classList.add('hidden');
                }

                // Trailer
                const trailerContainer = document.getElementById('res-trailer-container');
                if (data.trailer_url) {
                    document.getElementById('res-trailer').href = data.trailer_url;
                    trailerContainer.classList.remove('hidden');
                } else {
                    trailerContainer.classList.add('hidden');
                }

                // Performers
                const perfContainer = document.getElementById('res-performers');
                perfContainer.innerHTML = '';
                if (data.performers && data.performers.length > 0) {
                    data.performers.forEach(p => {
                        const span = document.createElement('span');
                        span.className = 'px-3 py-1 bg-pink-900/30 text-pink-300 border border-pink-800 rounded-full text-sm font-medium';
                        span.textContent = p.name;
                        perfContainer.appendChild(span);
                    });
                } else {
                    perfContainer.innerHTML = '<span class="text-gray-500">None</span>';
                }

                // Genres
                const genresContainer = document.getElementById('res-genres');
                genresContainer.innerHTML = '';
                if (data.genres && data.genres.length > 0) {
                    data.genres.forEach(g => {
                        const span = document.createElement('span');
                        span.className = 'px-3 py-1 bg-gray-800 text-gray-300 rounded-full text-sm';
                        span.textContent = g;
                        genresContainer.appendChild(span);
                    });
                } else {
                    genresContainer.innerHTML = '<span class="text-gray-500">None</span>';
                }

                // Screenshots
                const ssSection = document.getElementById('screenshots-section');
                const ssContainer = document.getElementById('res-screenshots');
                ssContainer.innerHTML = '';
                
                if (data.screenshot_urls && data.screenshot_urls.length > 0) {
                    ssSection.classList.remove('hidden');
                    data.screenshot_urls.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.className = 'w-full h-auto rounded-lg shadow-md border border-gray-700 hover:scale-105 transition-transform duration-200 cursor-pointer object-cover aspect-video';
                        img.onclick = () => window.open(url, '_blank');
                        ssContainer.appendChild(img);
                    });
                } else {
                    ssSection.classList.add('hidden');
                }

                // Show Results
                document.getElementById('result').classList.remove('hidden');

            } catch (err) {
                const errorEl = document.getElementById('error');
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
